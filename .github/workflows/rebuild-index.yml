# Rebuilds data/panda-index.json and data/lists.json, and re-reads every Panda's metadata account
# into data/metadata-snapshot.json, every Monday, and opens a PR when anything other than
# generatedAt changed. Merging the PR deploys the new index. Needs the repo secret RPC_URL (a DAS-capable
# endpoint, e.g. Helius), and "Allow GitHub Actions to create and approve pull requests" turned on
# under Settings → Actions → General.
#
# To stop it: disable it under Actions → Rebuild Panda index, or delete this file.

name: Rebuild Panda index

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rebuild-index
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Rebuild the index
        run: bun scripts/build-index.ts
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          RPC_RPS: "4"

      - name: Snapshot every Panda's on-chain metadata
        run: bun scripts/snapshot-metadata.ts
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          RPC_RPS: "4"

      - name: Compare with the committed index
        id: diff
        run: bun scripts/index-diff.ts | tee "$RUNNER_TEMP/summary.md"

      - name: Check the rebuilt index
        if: steps.diff.outputs.changed == 'true'
        run: bun check && bun test

      - name: Open or update the PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: index-rebuild
          delete-branch: true
          add-paths: |
            data/panda-index.json
            data/extra-mints.json
            data/lists.json
            data/metadata-snapshot.json
          commit-message: Rebuild the Panda index
          title: Rebuild the Panda index
          body-path: ${{ runner.temp }}/summary.md
