<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a1a13" />
    <title>Trash Panda Check: Degen Trash Panda art &amp; trait history</title>
    <meta
      name="description"
      content="Has a Degen Trash Panda's art or traits changed since mint? Enter a Panda number to see its full on-chain metadata history."
    />
    <!-- Share card. The server fills in absolute URLs for og:image, twitter:image and og:url
         from the domain the page is served on (src/share.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Trash Panda Check" />
    <meta property="og:title" content="Trash Panda Check: Degen Trash Panda art &amp; trait history" />
    <meta
      property="og:description"
      content="Has a Degen Trash Panda's art or traits changed since mint? Enter a Panda number to see its full on-chain metadata history."
    />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Trash Panda Check: check your Panda's art and traits" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Trash Panda Check: Degen Trash Panda art &amp; trait history" />
    <meta
      name="twitter:description"
      content="Has a Degen Trash Panda's art or traits changed since mint? Enter a Panda number to see its full on-chain metadata history."
    />
    <meta name="twitter:image" content="/og.png" />
    <link rel="icon" type="image/png" href="./dtp-logo.png" />
    <link rel="apple-touch-icon" href="./dtp-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap"
    />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./app.ts"></script>
  </head>
  <body>
    <header class="band">
      <div class="band-inner">
        <a class="wordmark" href="/"><img class="logo" src="./dtp-logo-mark.png" alt="" width="44" height="44" />Trash Panda Check</a>
        <form id="lookup" class="search" role="search">
          <!-- Phone browsers ignore autocomplete="off" and offer contact AutoFill when a label says
               "number" or "address", so the label avoids those words and the field is a search box. -->
          <label for="q">Panda # or mint</label>
          <div class="search-row">
            <input
              id="q"
              name="q"
              type="search"
              enterkeyhint="search"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
              data-1p-ignore
              data-lpignore="true"
              data-form-type="other"
              placeholder="15700"
              required
            />
            <button type="submit">Check</button>
            <button type="button" id="random" class="dice" aria-label="Random Panda" title="Random Panda">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="2" />
                <circle cx="8.5" cy="8.5" r="1.6" fill="currentColor" />
                <circle cx="15.5" cy="8.5" r="1.6" fill="currentColor" />
                <circle cx="12" cy="12" r="1.6" fill="currentColor" />
                <circle cx="8.5" cy="15.5" r="1.6" fill="currentColor" />
                <circle cx="15.5" cy="15.5" r="1.6" fill="currentColor" />
              </svg>
            </button>
          </div>
        </form>
      </div>
    </header>
    <main id="result" aria-live="polite"></main>
  </body>
</html>
