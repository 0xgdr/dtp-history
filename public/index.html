<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trash Panda Check</title>
    <meta name="description" content="Has this Degenerate Trash Panda's art or traits changed since mint?" />
    <link rel="icon" type="image/png" href="./dtp-logo.png" />
    <link rel="apple-touch-icon" href="./dtp-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap"
    />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./app.ts"></script>
  </head>
  <body>
    <header class="band">
      <div class="band-inner">
        <a class="wordmark" href="/"><img class="logo" src="./dtp-logo.png" alt="" width="44" height="44" />Trash Panda Check</a>
        <form id="lookup" class="search" role="search">
          <label for="q">Panda number or mint address</label>
          <div class="search-row">
            <input id="q" name="n" autocomplete="off" spellcheck="false" inputmode="text" placeholder="15700" required />
            <button type="submit">Check</button>
          </div>
        </form>
      </div>
    </header>
    <main id="result" aria-live="polite"></main>
  </body>
</html>
