<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DTP History</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./app.ts"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Panda history</h1>
        <p class="sub">Degenerate Trash Pandas: has this Panda's art or traits changed since mint?</p>
      </header>
      <form id="lookup">
        <label for="q">Panda # or mint address</label>
        <div class="row">
          <input id="q" name="n" autocomplete="off" spellcheck="false" placeholder="6872" required />
          <button type="submit">Go</button>
        </div>
      </form>
      <section id="result" aria-live="polite"></section>
    </main>
  </body>
</html>
